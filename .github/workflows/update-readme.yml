name: Update README date

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Update date
        run: |
          sed -i "s|Last Edited on:.*|Last Edited on: $(date +'%d/%m/%Y')|g" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update last edited date"
          git push
